<!-- Esto se mostrará cuando pulsemos 'contratar'
 Es la info de cada tropa disponible en la tienda -->
<div id="contratar"class="">
    <p id="avisoContratar"></p>
    <div id="tropasContratar" class="">
        <div id="tropa1Contratar" class="tarjetaTropa">
            <p class="tipoTropa"><span id="nombreTropa1Contratar"></span></p>
            <img id="fotoTropa1Contratar" src="" style="visibility: hidden">
            <p class="infoTropa"><span id="vidaTropa1Contratar"></span>  <span id="ataqueTropa1Contratar"></span></p>
            <p class="precioTropa"><span id="oroTropa1Contratar"></span></p>
            <button id="btnContratarTropa1" data-index="0" class="">Contratar</button>
        </div>
        <div id="tropa2Contratar" class="tarjetaTropa">
            <p class="tipoTropa"><span id="nombreTropa2Contratar"></span></p>
            <img id="fotoTropa2Contratar" src="" style="visibility: hidden">
            <p class="infoTropa"><span id="vidaTropa2Contratar"></span>  <span id="ataqueTropa2Contratar"></span></p>
            <p class="precioTropa"><span id="oroTropa2Contratar"></span></p>
            <button id="btnContratarTropa2" data-index="1" class="">Contratar</button>
        </div>
        <div id="tropa3Contratar" class="tarjetaTropa">
            <p class="tipoTropa"><span id="nombreTropa3Contratar"></span></p>
            <img id="fotoTropa3Contratar" src="" style="visibility: hidden">
            <p class="infoTropa"><span id="vidaTropa3Contratar"></span>  <span id="ataqueTropa3Contratar"></span></p>
            <p class="precioTropa"><span id="oroTropa3Contratar"></span></p>
            <button id="btnContratarTropa3" data-index="2" class="">Contratar</button>
        </div>
    </div>
    <button id="btnGenerarOtras">Generar otras tropas</button>
</div>
